# ---------------------------------------
# Build system configuration (PEP 517/518)
# ---------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


# ---------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------
[project]
name = "algorithms"
version = "0.1.0"
description = "Algorithm implementations and experiments."
readme = "README.md"
requires-python = ">=3.12"

# Add dependencies as you need them
dependencies = []

[project.optional-dependencies]
# Development dependencies
dev = ["pytest>=8.2.0", "pytest-cov>=4.1.0", "mypy>=1.16.0", "ruff>=0.8.0"]


# ---------------------------------------
# setuptools configuration
# ---------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


# ---------------------------------------
# Ruff configuration (linting & formatting)
# ---------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "RUF", # Ruff-specific rules
    "PLE", # Pylint errors
    "PLR", # Pylint refactor
    "PLW", # Pylint warnings
]

ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004",
]

[tool.ruff.lint.isort]
known-first-party = ["algorithms"]


# ---------------------------------------
# mypy configuration (static typing)
# ---------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true


# ---------------------------------------
# pytest configuration
# ---------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --tb=short --strict-markers"
